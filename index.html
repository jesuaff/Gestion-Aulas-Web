
{% extends "base.html" %}
{% block title %}Inicio{% endblock %}
{% block content %}
<h2>Lista de Aulas</h2>
<ul class="list-group">
    {% for aula in aulas %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ aula.nombre }}
            <a href="{{ url_for('ver_horarios', aula_id=aula.id) }}" class="btn btn-sm btn-primary">Ver horarios</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
