
{% extends "base.html" %}
{% block title %}Registrar Horario{% endblock %}
{% block content %}
<h2>Registrar Horario</h2>
<form method="post">
    <div class="mb-3">
        <label>Aula:</label>
        <select name="aula_id" class="form-control">
            {% for aula in aulas %}
                <option value="{{ aula.id }}">{{ aula.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>Inicio:</label>
        <input type="time" name="inicio" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Fin:</label>
        <input type="time" name="fin" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
</form>
{% endblock %}
